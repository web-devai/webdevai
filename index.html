<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebDev AI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      position: relative;
    }

    /* Fullscreen Web Frame */
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Extended Cover Overlay (Clickable Homepage Link) */
    .watermark-cover {
      position: fixed;
      bottom: 0;
      right: 0;
      z-index: 999999;
      width: 220px;
      height: 60px;
      background-color: #0f172a;
      color: #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-decoration: none;
      border-top-left-radius: 10px;
      border-top: 2px solid #38bdf8;
      border-left: 2px solid #38bdf8;
      box-shadow: -4px -4px 15px rgba(0, 0, 0, 0.7);
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s;
    }

    .watermark-cover:hover {
      background-color: #38bdf8;
      color: #0f172a;
    }
  </style>
</head>
<body>

  <iframe 
    src="https://webdevai.base44.app" 
    title="WebDev AI"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
    allowfullscreen>
  </iframe>

  <a href="https://webdevai.base44.app" class="watermark-cover">
    WebDev AI
  </a>

</body>
</html>
