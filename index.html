<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebDev AI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #05050d;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Embedded Web Application */
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Curved Rectangle Dark Palette Cover */
    .badge-cover {
      position: fixed;
      bottom: 0;
      right: 0;
      z-index: 999999;
      width: 210px;
      height: 52px;
      
      /* Dark Gradient combining Black, Really Dark Navy, Dark Purple, and Purple */
      background: linear-gradient(135deg, #05050d 0%, #0a0d1a 35%, #120924 70%, #2a124d 100%);
      color: #a855f7;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      
      /* Curved edges (Top-Left rounded rectangle layout) */
      border-top-left-radius: 16px;
      border-top: 1px solid rgba(168, 85, 247, 0.3);
      border-left: 1px solid rgba(168, 85, 247, 0.3);
      box-shadow: -5px -5px 20px rgba(0, 0, 0, 0.9);
      
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    /* Glowing Purple Accent Icon */
    .badge-icon {
      width: 9px;
      height: 9px;
      background-color: #c084fc;
      border-radius: 50%;
      box-shadow: 0 0 8px #c084fc;
    }

    /* Hover State */
    .badge-cover:hover {
      background: linear-gradient(135deg, #0a0d1a 0%, #120924 50%, #3b156b 100%);
      color: #ffffff;
      border-color: #c084fc;
      box-shadow: -5px -5px 25px rgba(168, 85, 247, 0.4);
    }
  </style>
</head>
<body>

  <iframe 
    src="https://webdevai.base44.app" 
    title="WebDev AI"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
    allowfullscreen>
  </iframe>

  <a href="http://webdevai.isroot.in/" class="badge-cover">
    <span class="badge-icon"></span>
    WebDev AI
  </a>

</body>
</html>
