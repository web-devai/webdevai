<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebDev AI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0f19;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Embedded Web Application */
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Extra-Large Full-Coverage Dark Badge Cover */
    .badge-cover {
      position: fixed;
      bottom: 0;
      right: 0;
      z-index: 999999;
      width: 260px;
      height: 65px;
      
      /* Dark styling with rounded top-left corner */
      background: #111827;
      color: #38bdf8;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 0.5px;
      
      border-top-left-radius: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      border-left: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: -5px -5px 20px rgba(0, 0, 0, 0.8);
      
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.25s ease;
      cursor: pointer;
    }

    /* Circular icon dot */
    .badge-icon {
      width: 12px;
      height: 12px;
      background-color: #38bdf8;
      border-radius: 50%;
      box-shadow: 0 0 10px #38bdf8;
    }

    /* Hover effect */
    .badge-cover:hover {
      background: #1e293b;
      color: #ffffff;
      border-color: #38bdf8;
    }
  </style>
</head>
<body>

  <iframe 
    src="https://webdevai.base44.app" 
    title="WebDev AI"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
    allowfullscreen>
  </iframe>

  <a href="http://webdevai.isroot.in/" class="badge-cover">
    <span class="badge-icon"></span>
    WebDev AI
  </a>

</body>
</html>
