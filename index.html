<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebDev AI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #05050d;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Embedded Web Application */
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Compact Fully Curved Pill Cover */
    .badge-cover {
      position: fixed;
      bottom: 6px;
      right: 6px;
      z-index: 999999;
      width: 170px;
      height: 38px;
      
      /* Dark Palette Gradient */
      background: linear-gradient(135deg, #05050d 0%, #0a0d1a 40%, #120924 75%, #2a124d 100%);
      color: #a855f7;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
      
      /* Fully Curved Edges (Pill Shape) */
      border-radius: 20px;
      border: 1px solid rgba(168, 85, 247, 0.35);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.85);
      
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    /* Small Glowing Dot */
    .badge-icon {
      width: 7px;
      height: 7px;
      background-color: #c084fc;
      border-radius: 50%;
      box-shadow: 0 0 6px #c084fc;
    }

    /* Hover State */
    .badge-cover:hover {
      background: linear-gradient(135deg, #0a0d1a 0%, #120924 50%, #3b156b 100%);
      color: #ffffff;
      border-color: #c084fc;
      box-shadow: 0 4px 20px rgba(168, 85, 247, 0.4);
    }
  </style>
</head>
<body>

  <!-- Embedded Web Application -->
  <iframe 
    src="https://webdevai.base44.app" 
    title="WebDev AI"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
    allowfullscreen>
  </iframe>

  <!-- Compact Curved Cover Badge -->
  <a href="http://webdevai.isroot.in/" class="badge-cover">
    <span class="badge-icon"></span>
    WebDev AI
  </a>

</body>
</html>
