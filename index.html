<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebDev AI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Embedded Web Application */
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Curved Rectangle Badge Off the Screen Edge */
    .badge-cover {
      position: fixed;
      /* Offsets from the corner so it floats cleanly */
      bottom: 12px;
      right: 12px;
      z-index: 999999;
      
      /* Dimensions tailored to completely cover the Base44 badge */
      width: 210px;
      height: 48px;
      
      /* Dark Black with subtle Dark Purple Gradient */
      background: linear-gradient(135deg, #090312 0%, #000000 60%, #1a0b2e 100%);
      color: #c084fc;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      
      /* Curved Rectangle Styling (matching your second screenshot) */
      border-radius: 12px;
      border: 1px solid rgba(192, 132, 252, 0.4);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.95);
      
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.25s ease;
      cursor: pointer;
    }

    /* Glowing Accent Icon */
    .badge-icon {
      width: 9px;
      height: 9px;
      background-color: #c084fc;
      border-radius: 50%;
      box-shadow: 0 0 8px #c084fc;
    }

    /* Hover effect */
    .badge-cover:hover {
      background: linear-gradient(135deg, #120624 0%, #090312 60%, #2a124d 100%);
      color: #ffffff;
      border-color: #c084fc;
      box-shadow: 0 6px 24px rgba(192, 132, 252, 0.3);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <!-- Embedded Application -->
  <iframe 
    src="https://webdevai.base44.app" 
    title="WebDev AI"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
    allowfullscreen>
  </iframe>

  <!-- Curved Floating Badge Cover -->
  <a href="http://webdevai.isroot.in/" class="badge-cover">
    <span class="badge-icon"></span>
    WebDev AI
  </a>

</body>
</html>
