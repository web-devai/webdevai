<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebDev AI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0f19;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Embedded Web Application */
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Natural Floating Dark Badge Cover */
    .badge-cover {
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 999999;
      padding: 12px 24px;
      
      /* Dark organic styling with squircle rounded corners */
      background: #111827;
      color: #38bdf8;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    /* Small circular accent icon inside badge */
    .badge-icon {
      width: 10px;
      height: 10px;
      background-color: #38bdf8;
      border-radius: 50%;
      box-shadow: 0 0 10px #38bdf8;
    }

    /* Hover animation */
    .badge-cover:hover {
      background: #1e293b;
      color: #ffffff;
      transform: translateY(-2px);
      border-color: #38bdf8;
      box-shadow: 0 15px 30px -5px rgba(56, 189, 248, 0.3);
    }
  </style>
</head>
<body>

  <iframe 
    src="https://webdevai.base44.app" 
    title="WebDev AI"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
    allowfullscreen>
  </iframe>

  <a href="http://webdevai.isroot.in/" class="badge-cover">
    <span class="badge-icon"></span>
    WebDev AI
  </a>

</body>
</html>
