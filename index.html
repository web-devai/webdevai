<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebDev AI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      position: relative;
    }

    /* Embedded App Frame */
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* WebDev AI Watermark Badge (Covers bottom right) */
    .watermark-overlay {
      position: fixed;
      bottom: 0;
      right: 0;
      z-index: 999999;
      background-color: #0f172a;
      color: #38bdf8;
      padding: 10px 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      border-top-left-radius: 8px;
      box-shadow: -2px -2px 10px rgba(0, 0, 0, 0.5);
      border-left: 1px solid #334155;
      border-top: 1px solid #334155;
      pointer-events: auto;
      user-select: none;
    }
  </style>
</head>
<body>

  <iframe 
    src="https://webdevai.base44.app" 
    title="WebDev AI"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
    allowfullscreen>
  </iframe>

  <div class="watermark-overlay">
    Powered by WebDev AI
  </div>

</body>
</html>
