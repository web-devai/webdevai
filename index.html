<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebDev AI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Embedded Web Application */
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Full-Coverage Badge with All Corners Curved */
    .badge-cover {
      position: fixed;
      bottom: 0;
      right: 0;
      z-index: 999999;
      
      /* Sized to guarantee full coverage of the Base44 tag */
      width: 250px;
      height: 52px;
      
      /* Dark Black & Subtle Purple Gradient */
      background: linear-gradient(135deg, #090312 0%, #000000 60%, #1a0b2e 100%);
      color: #c084fc;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      
      /* All corners rounded (top-left, top-right, bottom-right, bottom-left) */
      border-radius: 16px;
      border: 1px solid rgba(192, 132, 252, 0.4);
      box-shadow: -4px -4px 20px rgba(0, 0, 0, 0.95);
      
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.25s ease;
      cursor: pointer;
    }

    /* Code Logo Styling </ > */
    .code-logo {
      font-family: monospace;
      font-weight: 900;
      font-size: 1.1rem;
      color: #c084fc;
      letter-spacing: -1px;
      text-shadow: 0 0 8px rgba(192, 132, 252, 0.6);
    }

    /* Hover State */
    .badge-cover:hover {
      background: linear-gradient(135deg, #120624 0%, #090312 60%, #2a124d 100%);
      color: #ffffff;
      border-color: #c084fc;
      box-shadow: -4px -4px 25px rgba(192, 132, 252, 0.3);
    }

    .badge-cover:hover .code-logo {
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
    }
  </style>
</head>
<body>

  <!-- Embedded Web Application -->
  <iframe 
    src="https://webdevai.base44.app" 
    title="WebDev AI"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
    allowfullscreen>
  </iframe>

  <!-- Full Coverage Floating Badge -->
  <a href="http://webdevai.isroot.in/" class="badge-cover">
    <span class="code-logo">&lt;/&gt;</span>
    WebDev AI
  </a>

</body>
</html>
